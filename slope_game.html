<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slope Guessing Game</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --green: #10b981;
    --orange: #f59e0b;
    --red: #ef4444;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: linear-gradient(180deg, #eef4ff, #f4f7fb 300px);
    color: var(--text);
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
  }
  header h1 {
    font-size: 2.2em;
    margin-bottom: 5px;
    color: #2563eb;
  }
  header p {
    font-size: 1.15em;
    color: #4b5563;
    max-width: 700px;
    margin: 10px auto;
  }
  a.back-link {
    display: inline-block;
    margin-bottom: 10px;
    color: #2563eb;
    text-decoration: none;
    font-size: 0.95em;
  }
  a.back-link:hover { text-decoration: underline; }

  main {
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 20px;
    font-size: 1.1em;
  }
  .scoreboard span { font-weight: bold; }
  #score { color: var(--green); }
  #streak { color: var(--purple); }

  .chart-wrap {
    max-width: 480px;
    margin: 0 auto 20px auto;
  }

  .picker {
    margin-bottom: 18px;
  }
  .picker h3 {
    margin: 0 0 8px 0;
    font-size: 1.05em;
    color: #1e3a8a;
  }
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .opt-btn {
    border: 2px solid #d1d5db;
    background: #fff;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 1em;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .opt-btn:hover { border-color: var(--blue); transform: translateY(-2px); }
  .opt-btn.selected { border-color: var(--blue); background: #eef4ff; font-weight: bold; }
  .opt-btn.correct { border-color: var(--green); background: #ecfdf5; font-weight: bold; }
  .opt-btn.wrong { border-color: var(--red); background: #fef2f2; }

  .actions {
    text-align: center;
    margin-top: 20px;
  }
  button.main-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 1.05em;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(59,130,246,0.35);
  }
  button.main-btn:hover { background: #2563eb; }
  button.main-btn:disabled { background: #93c5fd; cursor: not-allowed; box-shadow: none; }

  #feedback {
    text-align: center;
    font-size: 1.3em;
    min-height: 1.6em;
    margin: 16px 0 4px 0;
    font-weight: bold;
  }
  #feedback.good { color: var(--green); }
  #feedback.bad { color: var(--red); }
</style>
</head>
<body>

<main>
  <a class="back-link" href="index.html">&larr; Back to Math Topics</a>
  <header>
    <h1>🎯 Slope Guessing Game</h1>
    <p>A line flashes on the graph. Guess its slope (m) and y-intercept (b) before it outsmarts you!</p>
  </header>

  <div class="card">
    <div class="scoreboard">
      <div>Score: <span id="score">0</span></div>
      <div>Streak: <span id="streak">0</span> 🔥</div>
    </div>

    <div class="chart-wrap">
      <canvas id="gameChart" height="320"></canvas>
    </div>

    <div class="picker">
      <h3>Slope (m):</h3>
      <div class="options" id="mOptions"></div>
    </div>
    <div class="picker">
      <h3>Y-intercept (b):</h3>
      <div class="options" id="bOptions"></div>
    </div>

    <div id="feedback"></div>

    <div class="actions">
      <button class="main-btn" id="checkBtn">Check my guess</button>
      <button class="main-btn" id="nextBtn" style="display:none;">Next line &rarr;</button>
    </div>
  </div>
</main>

<script>
  const X_MIN = -6, X_MAX = 6, Y_MIN = -8, Y_MAX = 8;
  const M_CHOICES = [-3, -2, -1, 1, 2, 3];
  const B_CHOICES = [-4, -2, -1, 0, 1, 2, 4];

  const CORRECT_MESSAGES = [
    "🎉 Nailed it! You read that line like a mind reader.",
    "🧠 Boom! Slope whisperer strikes again.",
    "🔥 Correct! That line never stood a chance.",
    "✅ Yes! Math professors are quietly impressed.",
    "🚀 Exactly right — to the moon with that streak!"
  ];
  const WRONG_MESSAGES = [
    "😬 Nope, that line just laughed at you.",
    "🙃 Close-ish? No. But nice try.",
    "🐌 Not quite — the line slipped away.",
    "😅 Oof, math gremlins strike again.",
    "🤔 Wrong answer, but great confidence!"
  ];

  let score = 0;
  let streak = 0;
  let currentM = 0, currentB = 0;
  let pickedM = null, pickedB = null;
  let chart = null;
  let answered = false;

  function randChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function buildOptionButtons(containerId, choices, onPick) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    choices.forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = val;
      btn.addEventListener('click', () => onPick(val, btn));
      container.appendChild(btn);
    });
  }

  function pickM(val, btn) {
    if (answered) return;
    pickedM = val;
    document.querySelectorAll('#mOptions .opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    updateCheckBtn();
  }

  function pickB(val, btn) {
    if (answered) return;
    pickedB = val;
    document.querySelectorAll('#bOptions .opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    updateCheckBtn();
  }

  function updateCheckBtn() {
    document.getElementById('checkBtn').disabled = (pickedM === null || pickedB === null);
  }

  function drawLine(m, b) {
    const ctx = document.getElementById('gameChart').getContext('2d');
    const points = [
      { x: X_MIN, y: m * X_MIN + b },
      { x: X_MAX, y: m * X_MAX + b }
    ];
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [{
          data: points,
          borderColor: '#8b5cf6',
          borderWidth: 3,
          pointRadius: 0,
          fill: false,
          tension: 0
        }]
      },
      options: {
        responsive: true,
        animation: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { type: 'linear', min: X_MIN, max: X_MAX, grid: { color: '#e5e7eb' } },
          y: { min: Y_MIN, max: Y_MAX, grid: { color: '#e5e7eb' } }
        }
      }
    });
  }

  function newRound() {
    answered = false;
    pickedM = null;
    pickedB = null;
    currentM = randChoice(M_CHOICES);
    currentB = randChoice(B_CHOICES);
    drawLine(currentM, currentB);
    buildOptionButtons('mOptions', M_CHOICES, pickM);
    buildOptionButtons('bOptions', B_CHOICES, pickB);
    updateCheckBtn();
    const fb = document.getElementById('feedback');
    fb.textContent = '';
    fb.className = '';
    document.getElementById('checkBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').style.display = 'none';
  }

  function checkAnswer() {
    if (pickedM === null || pickedB === null) return;
    answered = true;
    const correct = (pickedM === currentM && pickedB === currentB);
    const fb = document.getElementById('feedback');

    document.querySelectorAll('#mOptions .opt-btn').forEach(b => {
      const v = Number(b.textContent);
      if (v === currentM) b.classList.add('correct');
      else if (v === pickedM) b.classList.add('wrong');
    });
    document.querySelectorAll('#bOptions .opt-btn').forEach(b => {
      const v = Number(b.textContent);
      if (v === currentB) b.classList.add('correct');
      else if (v === pickedB) b.classList.add('wrong');
    });

    if (correct) {
      score++;
      streak++;
      fb.textContent = randChoice(CORRECT_MESSAGES);
      fb.className = 'good';
    } else {
      streak = 0;
      fb.textContent = randChoice(WRONG_MESSAGES) + ` (It was m=${currentM}, b=${currentB})`;
      fb.className = 'bad';
    }
    document.getElementById('score').textContent = score;
    document.getElementById('streak').textContent = streak;

    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
  }

  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('nextBtn').addEventListener('click', newRound);

  newRound();
</script>

</body>
</html>
